    <script>
      // Legacy hash URLs (#/profile/name) -> clean URLs (/profile/name)
      (function () {
        var hash = window.location.hash;
        if (hash.indexOf('#/') === 0) {
          var target = hash.slice(1);
          // Cloudflare Pages serves /route/ and redirects /route -> /route/
          if (target !== '/' && target.indexOf('?') === -1 && !/\.[a-z0-9]+$/i.test(target)) {
            target = target.replace(/\/+$/, '') + '/';
          }
          window.location.replace(target);
        }
      })();
    </script>
