name: Check FansLeak contact bot

on:
  pull_request:
    paths:
      - "contact-bot/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-contact-bot.yml"
      - "package.json"
  push:
    branches:
      - "feature/selar-bank-contact-bot"
    paths:
      - "contact-bot/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/check-contact-bot.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run automated test suite
        run: npm test
      - name: Compile Worker and validate Wrangler configuration without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/fansleak-contact-bot-build --config contact-bot/wrangler.toml
