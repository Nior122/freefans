name: Refresh profile media

# Tops up the bundled media arrays in services/<id>Data.json from the public
# source listing, then commits the result back to the branch that triggered it.
# Runs only when services/.coomer-targets.json changes (or when dispatched
# manually), so normal pushes never scrape anything.

on:
  push:
    paths:
      - "services/.coomer-targets.json"
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated artist ids (blank = services/.coomer-targets.json)"
        required: false
        default: ""
      limit:
        description: "Maximum images per profile"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: refresh-profile-media
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Crawl public listings
        run: |
          LIMIT="${{ github.event.inputs.limit || 200 }}"
          IDS="${{ github.event.inputs.ids }}"
          if [ -n "$IDS" ]; then
            node scripts/fetch-coomer-media.mjs --limit "$LIMIT" --ids "$IDS"
          else
            node scripts/fetch-coomer-media.mjs --limit "$LIMIT"
          fi

      - name: Validate the refreshed data
        run: node --test tests/coomer-media.test.mjs

      - name: Commit refreshed media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git commit -m "Refresh profile media from public listing"
          git push origin "HEAD:${{ github.ref_name }}"
