name: Deploy FansLeak contact bot

on:
  push:
    branches:
      - fan
  workflow_dispatch:
    inputs:
      contact_selar_checkout_url:
        description: "FansLeak contact/assessment Selar checkout URL"
        required: true
        type: string
      contact_selar_product_id:
        description: "Exact Selar product code for contact/assessment"
        required: true
        type: string
      service_selar_checkout_url:
        description: "Second service/product Selar checkout URL"
        required: true
        type: string
      service_selar_product_id:
        description: "Exact Selar product code for the second service/product"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-fansleak-contact-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Deploy exactly the ref this workflow was dispatched from. Run it from the
      # `fan` branch after the contact-bot PR has merged; there is deliberately no
      # pinned feature-branch ref here.
      - name: Check out deployment code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate both Selar product settings before any changes
        env:
          SELAR_CHECKOUT_URL: ${{ inputs.contact_selar_checkout_url || 'https://selar.com/j977zh71q8' }}
          SELAR_PRODUCT_ID: ${{ inputs.contact_selar_product_id || 'j977zh71q8' }}
          SERVICE_CHECKOUT_URL: ${{ inputs.service_selar_checkout_url || 'https://selar.com/x19128f988' }}
          SERVICE_PRODUCT_ID: ${{ inputs.service_selar_product_id || 'x19128f988' }}
        run: |
          set -euo pipefail
          [[ "$SELAR_CHECKOUT_URL" == https://* ]] || { echo "Contact checkout URL must use HTTPS"; exit 1; }
          [[ "$SERVICE_CHECKOUT_URL" == https://* ]] || { echo "Service checkout URL must use HTTPS"; exit 1; }
          [[ -n "$SELAR_PRODUCT_ID" && -n "$SERVICE_PRODUCT_ID" && "$SELAR_PRODUCT_ID" != "$SERVICE_PRODUCT_ID" ]] || { echo "Use two distinct, non-empty Selar product codes"; exit 1; }

      - name: Preflight all deployment secrets before production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SELAR_WEBHOOK_SECRET: ${{ secrets.SELAR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_ID SELAR_WEBHOOK_SECRET; do
            value="${!name}"
            test -n "$value" || { echo "Missing required GitHub Actions secret: $name"; exit 1; }
          done

      - name: Apply schema and migrations safely with complete verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          node scripts/migrate-d1.mjs --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npx --yes wrangler@4 deploy --config contact-bot/wrangler.toml

      - name: Configure runtime variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELAR_CHECKOUT_URL: ${{ inputs.contact_selar_checkout_url || 'https://selar.com/j977zh71q8' }}
          SELAR_PRODUCT_ID: ${{ inputs.contact_selar_product_id || 'j977zh71q8' }}
          SERVICE_CHECKOUT_URL: ${{ inputs.service_selar_checkout_url || 'https://selar.com/x19128f988' }}
          SERVICE_PRODUCT_ID: ${{ inputs.service_selar_product_id || 'x19128f988' }}
        run: |
          set -euo pipefail
          [[ "$SELAR_CHECKOUT_URL" == https://* ]] || { echo "Contact checkout URL must use HTTPS"; exit 1; }
          [[ "$SERVICE_CHECKOUT_URL" == https://* ]] || { echo "Service checkout URL must use HTTPS"; exit 1; }
          [[ -n "$SELAR_PRODUCT_ID" && -n "$SERVICE_PRODUCT_ID" && "$SELAR_PRODUCT_ID" != "$SERVICE_PRODUCT_ID" ]] || { echo "Use two distinct, non-empty Selar product codes"; exit 1; }
          printf '%s' "$SELAR_CHECKOUT_URL" | npx --yes wrangler@4 secret put SELAR_CHECKOUT_URL --config contact-bot/wrangler.toml
          printf '%s' "$SELAR_PRODUCT_ID" | npx --yes wrangler@4 secret put SELAR_PRODUCT_ID --config contact-bot/wrangler.toml
          printf '%s' "$SERVICE_CHECKOUT_URL" | npx --yes wrangler@4 secret put SERVICE_CHECKOUT_URL --config contact-bot/wrangler.toml
          printf '%s' "$SERVICE_PRODUCT_ID" | npx --yes wrangler@4 secret put SERVICE_PRODUCT_ID --config contact-bot/wrangler.toml

      - name: Configure required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SELAR_WEBHOOK_SECRET: ${{ secrets.SELAR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_ID SELAR_WEBHOOK_SECRET; do
            value="${!name}"
            test -n "$value" || { echo "Missing GitHub Actions secret: $name"; exit 1; }
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config contact-bot/wrangler.toml
          done

      - name: Connect Telegram webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub secret TELEGRAM_BOT_TOKEN"; exit 1; }
          [[ "$TELEGRAM_WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{1,256}$ ]] || { echo "TELEGRAM_WEBHOOK_SECRET must be 1-256 characters using only letters, numbers, underscore, or hyphen; secret value was not printed."; exit 1; }
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/5f7678c82c50be845dba6bd8280bfae5/workers/subdomain" | jq -er '.result.subdomain')"
          test -n "$subdomain" || { echo "Could not determine the Cloudflare workers.dev account subdomain"; exit 1; }
          worker_url="https://fansleak-contact-bot.${subdomain}.workers.dev/telegram/webhook"
          response="$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$worker_url" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            --data-urlencode "drop_pending_updates=false")"
          if ! printf '%s' "$response" | jq -e '.ok == true' >/dev/null; then
            printf '%s\n' "$response" | jq -r '"Telegram rejected setWebhook: " + (.description // "No error description returned")'
            exit 1
          fi
          echo "Telegram webhook configured successfully for $worker_url"
