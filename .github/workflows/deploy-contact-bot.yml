name: Deploy FansLeak contact bot

on:
  workflow_dispatch:
    inputs:
      contact_price_ngn:
        description: "Exact contact request fee in NGN"
        required: true
        type: string
      selar_checkout_url:
        description: "Selar checkout URL for the configured product"
        required: true
        type: string
      selar_product_id:
        description: "Exact Selar product ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-fansleak-contact-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          npx --yes wrangler@4 deploy --config contact-bot/wrangler.toml

      - name: Configure runtime variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTACT_PRICE_NGN: ${{ inputs.contact_price_ngn }}
          SELAR_CHECKOUT_URL: ${{ inputs.selar_checkout_url }}
          SELAR_PRODUCT_ID: ${{ inputs.selar_product_id }}
        run: |
          set -euo pipefail
          printf '%s' "$CONTACT_PRICE_NGN" | npx --yes wrangler@4 secret put CONTACT_PRICE_NGN --config contact-bot/wrangler.toml
          printf '%s' "$SELAR_CHECKOUT_URL" | npx --yes wrangler@4 secret put SELAR_CHECKOUT_URL --config contact-bot/wrangler.toml
          printf '%s' "$SELAR_PRODUCT_ID" | npx --yes wrangler@4 secret put SELAR_PRODUCT_ID --config contact-bot/wrangler.toml

      - name: Configure required Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          ADMIN_TELEGRAM_ID: ${{ secrets.ADMIN_TELEGRAM_ID }}
          SELAR_WEBHOOK_SECRET: ${{ secrets.SELAR_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET ADMIN_TELEGRAM_ID SELAR_WEBHOOK_SECRET; do
            value="${!name}"
            test -n "$value" || { echo "Missing GitHub Actions secret: $name"; exit 1; }
            printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --config contact-bot/wrangler.toml
          done

      - name: Connect Telegram webhook
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing GitHub Actions secret TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_WEBHOOK_SECRET" || { echo "Missing GitHub Actions secret TELEGRAM_WEBHOOK_SECRET"; exit 1; }
          subdomain="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/5f7678c82c50be845dba6bd8280bfae5/workers/scripts/fansleak-contact-bot/subdomain" | jq -er '.result.subdomain')"
          test -n "$subdomain"
          worker_url="https://fansleak-contact-bot.${subdomain}.workers.dev/telegram/webhook"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=$worker_url" \
            --data-urlencode "secret_token=$TELEGRAM_WEBHOOK_SECRET" \
            --data-urlencode "drop_pending_updates=false" | jq -e '.ok == true'
