<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FansLeak">
  <!-- Simplified flat mark for favicons: no glow, no drip, heavier strokes so it
       stays legible at 16x16. Same F/L lockup as the detailed logo. -->
  <rect width="64" height="64" rx="10" fill="#0a0a0a"/>
  <g fill="#f43f3f">
    <rect x="9" y="10" width="14" height="44" rx="3"/>
    <rect x="9" y="10" width="34" height="13" rx="3"/>
    <rect x="9" y="28" width="26" height="12" rx="3"/>
    <rect x="35" y="24" width="14" height="30" rx="3"/>
    <rect x="35" y="42" width="26" height="12" rx="3"/>
  </g>
</svg>
